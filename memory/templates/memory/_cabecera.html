{% load static %}
<header class="barra-superior" id="cabecera-sonic">
    <a class="marca" href="{% url 'memory:inicio' %}" aria-label="Volver al inicio de Sonic Memory Game" style="text-decoration:none">
        <img src="{% static 'memory/images/sonic-logo.gif' %}" alt="" class="logo-superior">
        <span class="titulo">SONIC MEMORY GAME</span>
    </a>
    <nav class="zona-usuario" aria-label="Acciones del jugador">
        {% if user.is_authenticated %}
            <div class="jugador">
                <span class="jugador-label">Jugador</span>
                <span class="jugador-nombre">{{ user.username }}</span>
            </div>
            <a href="{% url 'memory:perfil' %}" class="btn-superior btn-perfil">Mi perfil</a>
            <a href="{% url 'memory:top_semanal' %}" class="btn-superior btn-perfil">🏆 TOP 5</a>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn-superior btn-cerrar">Cerrar sesión</button>
            </form>
        {% else %}
            <a href="{% url 'cuentas_login' %}" class="btn-superior btn-perfil">Iniciar sesión</a>
        {% endif %}
    </nav>
</header>
