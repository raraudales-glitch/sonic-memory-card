{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}{% endblock %} | Sonic Memory Card</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 20%, rgba(0,80,255,.22), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(0,180,255,.15), transparent 35%),
                #05070d;
            color: #f1f5ff;
            font: 1rem/1.55 Arial, Helvetica, sans-serif;
        }
        .contenido-pagina {
            width: min(1080px, calc(100% - 32px));
            margin: 36px auto;
            padding: clamp(18px, 3.5vw, 36px);
            background: rgba(8, 19, 43, .94);
            border: 1px solid rgba(0, 145, 255, .35);
            border-radius: 18px;
            box-shadow: 0 18px 48px rgba(0, 0, 0, .4);
        }
        .navegacion-paginas {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 26px;
        }
        .navegacion-paginas a {
            padding: 9px 13px;
            color: white;
            background: #0969da;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .navegacion-paginas a:hover { background: #1784ff; }
        a { color: #9cddff; }
        a:focus-visible { outline: 3px solid #ffdf00; outline-offset: 3px; }
        [aria-current="page"] { color: #ffdd78; font-weight: bold; }
        h1 { margin: 0 0 22px; color: #ffdf00; }
        h2 { color: #f1f5ff; }
        p, ol, dl { line-height: 1.65; }
        .tabla { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 12px 10px; border-bottom: 1px solid #516480; text-align: left; }
        th { color: #f7faff; }
        dt { font-weight: bold; }
        dd { margin: 0 0 12px; }
        main > nav[aria-label="Paginación"], main > nav[aria-label="Dificultades"] {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 14px;
        }
        @media (max-width: 600px) {
            .contenido-pagina { width: calc(100% - 20px); margin: 18px auto; padding: 18px 14px; }
            .navegacion-paginas { gap: 6px; }
            .navegacion-paginas a { padding: 9px 10px; font-size: 12px; }
        }
    </style>
    <link rel="stylesheet" href="{% static 'memory/css/cabecera.css' %}?v=1">
</head>
<body>
    {% include "memory/_cabecera.html" %}
    <main class="contenido-pagina">
        <nav class="navegacion-paginas" aria-label="Navegación del juego">
            <a href="{% url 'memory:inicio' %}">Inicio</a>
            <a href="{% url 'memory:instrucciones' %}">Instrucciones</a>
            <a href="{% url 'memory:jugar' %}">Jugar</a>
            <a href="{% url 'memory:clasificacion' %}">Clasificación</a>
            {% if user.is_authenticated %}
                <a href="{% url 'memory:historial' %}">Historial</a>
            {% endif %}
        </nav>
        {% block contenido %}{% endblock %}
    </main>
    {% if user.is_authenticated %}
        <script defer src="{% static 'memory/js/menu_opciones.js' %}?v=8"></script>
    {% endif %}
</body>
</html>
